<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RL in Mobile Manipulation</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <div>
      <h1 id="title">Loading…</h1>
      <p class="question" id="question"></p>
      <p class="muted small" id="protocol"></p>
    </div>
    <div class="top-right">
      <div class="resources" id="resources"></div>
      <div class="muted small" id="updated"></div>
    </div>
  </header>

  <main>
    <section class="panel">
      <h2>Plan</h2>
      <ol class="plan" id="plan"></ol>
    </section>

    <section class="panel">
      <h2>Results <span class="hint">share of held-out cases delivered · darker part: delivered within the 15k-tick deadline</span></h2>
      <div class="matrices" id="matrix"></div>
    </section>

    <div class="row2">
      <section class="panel">
        <h2>What RL adds <span class="hint">standard objects</span></h2>
        <div id="added"></div>
      </section>
      <section class="panel">
        <h2>What each system learns</h2>
        <div id="pipeline"></div>
      </section>
    </div>

    <section class="panel">
      <h2>Training now <span class="hint">deterministic evaluations · hover for details</span></h2>
      <div class="train-grid" id="training"></div>
    </section>

    <section class="panel">
      <h2>Clips</h2>
      <div id="recordings"></div>
    </section>

    <footer class="foot">
      <nav class="docs" id="documents"></nav>
      <div id="active"></div>
    </footer>
  </main>
  <div class="tip" id="tip" hidden></div>
  <script src="/app.js"></script>
</body>
</html>
